[project]
name = "pipelineforge-json"
version = "0.1.0"
description = "Legacy .pfcfg to JSON migration proof tooling for PipelineForge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23.0,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
pipelineforge-json = "pipelineforge_json.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

testpaths = ["tests"]
